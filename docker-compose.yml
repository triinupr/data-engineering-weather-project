x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    DBT_PROJECT_DIR: /app/dbt/weather_transformations
    DBT_PROFILES_DIR: /app/dbt
    DBT_BIN: /opt/airflow/dbt-venv/bin/dbt
    POSTGRES_CONN_STR: postgresql://airflow:airflow@postgres:5432/airflow
    DBT_HOST: postgres
    DBT_PORT: "5432"
    DBT_USER: airflow
    DBT_PASSWORD: airflow
    DBT_DATABASE: airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/app/src:ro
    - ./dbt:/app/dbt
    - ./data:/app/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    working_dir: /app/dbt
    volumes:
      - ./dbt:/app/dbt
    environment:
      DBT_PROFILES_DIR: /app/dbt
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: airflow
      DBT_PASSWORD: airflow
      DBT_DATABASE: airflow
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

  ingestion:
    build: .
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Data \
          --lastname Engineering \
          --role Admin \
          --email admin@example.com || airflow users list | grep -w admin
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  airflow_logs:
